name: Restore Dashboard Data

on:
  workflow_dispatch:
    inputs:
      restore_commit:
        description: "Commit that contains the correct dashboard data"
        required: true
        default: "7c5cfae"

permissions:
  contents: write

jobs:
  restore-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore dashboard data files
        run: |
          RESTORE_COMMIT="${{ github.event.inputs.restore_commit }}"
          git checkout "$RESTORE_COMMIT" -- \
            deploy-ai3d-youtube-dashboard-v1/data/dashboard-data.js \
            deploy-ai3d-youtube-dashboard-v1/data/automation-config.js \
            deploy-ai3d-youtube-dashboard-v1/data/manual-review.json \
            docs/data/dashboard-data.js \
            docs/data/automation-config.js \
            docs/data/manual-review.json

      - name: Commit restored data
        run: |
          if git diff --quiet; then
            echo "No data changes to restore."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-ai3d-youtube-dashboard-v1/data/ docs/data/
          git commit -m "Restore dashboard data"
          git push
