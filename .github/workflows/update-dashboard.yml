name: Update YouTube Research Dashboard

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of recent YouTube videos to scan"
        required: false
        default: "7"
  schedule:
    # Monday 10:15 Asia/Shanghai = Monday 02:15 UTC
    - cron: "15 2 * * 1"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update dashboard data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        working-directory: deploy-ai3d-youtube-dashboard-v1
        run: |
          LOOKBACK_DAYS="${{ github.event.inputs.lookback_days || '7' }}"
          python scripts/update_youtube_dashboard.py --lookback-days "$LOOKBACK_DAYS"

      - name: Sync GitHub Pages files
        run: |
          mkdir -p docs
          rsync -a --delete \
            --exclude ".github" \
            --exclude "__pycache__" \
            deploy-ai3d-youtube-dashboard-v1/ docs/

      - name: Commit updated data
        run: |
          if git diff --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-ai3d-youtube-dashboard-v1/data/dashboard-data.js \
                  deploy-ai3d-youtube-dashboard-v1/data/automation-config.js \
                  deploy-ai3d-youtube-dashboard-v1/data/manual-review.json \
                  docs/
          git commit -m "Update YouTube dashboard data"
          git push
